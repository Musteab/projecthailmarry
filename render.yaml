# Render blueprint: one web service built from the Dockerfile.
# NOT YET VERIFIED against a live Render account. See docs/DEPLOY.md before relying on it.
services:
  - type: web
    name: bastion
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Set this one by hand in the dashboard; it is the password of the demo accounts.
      - key: SEED_DEMO_PASSWORD
        sync: false
      - key: INTEL_MODE
        value: cache
